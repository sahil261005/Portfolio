<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A figure gazing up at a starry spiral sky">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#a3c2ff"/>
      <stop offset="35%" stop-color="#1d4f9c"/>
      <stop offset="80%" stop-color="#06122a"/>
      <stop offset="100%" stop-color="#040912"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="60%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="1200" height="600" fill="url(#sky)"/>

  <!-- spiral: 12 concentric ellipses with the same center, decreasing widths -->
  <g transform="translate(760 200) rotate(-8)" fill="none" stroke="rgba(220,232,255,0.85)" stroke-width="0.7">
    <ellipse rx="500" ry="200"/>
    <ellipse rx="440" ry="180"/>
    <ellipse rx="380" ry="160"/>
    <ellipse rx="325" ry="142"/>
    <ellipse rx="275" ry="125"/>
    <ellipse rx="225" ry="108"/>
    <ellipse rx="180" ry="92"/>
    <ellipse rx="140" ry="76"/>
    <ellipse rx="105" ry="60"/>
    <ellipse rx="75"  ry="46"/>
    <ellipse rx="50"  ry="32"/>
    <ellipse rx="28"  ry="20"/>
  </g>
  <!-- centre halo -->
  <circle cx="760" cy="200" r="120" fill="url(#halo)"/>
  <circle cx="760" cy="200" r="14" fill="white"/>

  <!-- distant mountains -->
  <path d="M 0 470 L 200 410 L 320 440 L 460 400 L 600 430 L 740 390 L 880 425 L 1020 395 L 1200 430 L 1200 600 L 0 600 Z" fill="#0b1426" opacity="0.85"/>
  <path d="M 0 510 L 180 470 L 360 495 L 520 460 L 700 490 L 880 460 L 1050 495 L 1200 470 L 1200 600 L 0 600 Z" fill="#070b16"/>

  <!-- scattered stars -->
  <g fill="white">
    <circle cx="120"  cy="60"  r="0.9"/>
    <circle cx="200"  cy="120" r="0.6"/>
    <circle cx="300"  cy="80"  r="0.7"/>
    <circle cx="420"  cy="40"  r="0.5"/>
    <circle cx="540"  cy="100" r="0.8"/>
    <circle cx="660"  cy="60"  r="0.6"/>
    <circle cx="900"  cy="80"  r="0.7"/>
    <circle cx="1020" cy="130" r="0.5"/>
    <circle cx="1100" cy="60"  r="0.7"/>
    <circle cx="80"   cy="200" r="0.5"/>
    <circle cx="240"  cy="220" r="0.6"/>
    <circle cx="380"  cy="280" r="0.5"/>
    <circle cx="950"  cy="330" r="0.6"/>
    <circle cx="1080" cy="350" r="0.5"/>
    <circle cx="60"   cy="320" r="0.7"/>
  </g>

  <!-- figure (small, lower-left) -->
  <g transform="translate(170 320)" fill="#0d1426" stroke="#0d1426" stroke-width="2" stroke-linejoin="round">
    <!-- head -->
    <circle cx="0" cy="0" r="20" fill="#1d2638" stroke="#3a4a66"/>
    <!-- hair tufts -->
    <path d="M -12 -14 q 4 -10 14 -6 q 8 -8 16 2 q 6 -2 8 6" fill="#22304a" stroke="none"/>
    <!-- shoulders / cape -->
    <path d="M -34 18 q -10 38 -8 96 l 90 0 q 4 -56 -10 -94 q -16 -22 -34 -22 z" fill="#0a0f1d" stroke="#3a4a66"/>
    <path d="M -28 36 q -4 50 -2 80 l 14 0 l 0 -84 z" fill="#091222"/>
  </g>

  <!-- ground under figure -->
  <rect x="0" y="500" width="1200" height="100" fill="url(#ground)"/>

  <!-- vignette -->
  <rect x="0" y="0" width="1200" height="600" fill="url(#ground)" opacity="0"/>
</svg>
