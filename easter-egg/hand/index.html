    <!-- Hand Canvas & Scroll Script -->
    <script>
      (function() {
        const TOTAL_FRAMES = 288;
        const images = [];
        let loadedCount = 0;
        let currentFrame = 0;

        const preloader = document.getElementById('preloader');
        const loadingBar = document.getElementById('loading-bar');
        const loadingText = document.getElementById('loading-text');
        const canvas = document.getElementById('hand-canvas');
        const ctx = canvas.getContext('2d');
        const scrollContainer = document.getElementById('scroll-container');
        const stickyFrame = document.getElementById('sticky-frame');
        const keepGoingEls = document.querySelectorAll('.keep-going');

        // Prevent scrolling during preloading
        document.body.style.overflow = 'hidden';

        function updateLoading(loaded) {
          const pct = Math.round((loaded / TOTAL_FRAMES) * 100);
          if (loadingBar) loadingBar.style.width = pct + '%';
          if (loadingText) loadingText.textContent = pct + '%';
        }

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          drawFrame(currentFrame);
        }

        function drawFrame(frameIdx) {
          if (!images[frameIdx] || !images[frameIdx].complete) return;
          const img = images[frameIdx];
          
          const cw = canvas.width;
          const ch = canvas.height;
          const iw = img.width || 1920;
          const ih = img.height || 1080;

          const scale = Math.min(cw / iw, ch / ih);
          const dw = iw * scale;
          const dh = ih * scale;
          const dx = (cw - dw) / 2;
          const dy = (ch - dh) / 2;

          ctx.clearRect(0, 0, cw, ch);
          ctx.drawImage(img, 0, 0, iw, ih, dx, dy, dw, dh);
        }

        // Preload all 288 frames
        const promises = [];
        for (let i = 1; i <= TOTAL_FRAMES; i++) {
          const img = new Image();
          const p = new Promise(resolve => {
            img.onload = () => {
              loadedCount++;
              updateLoading(loadedCount);
              resolve();
            };
            img.onerror = () => {
              loadedCount++;
              updateLoading(loadedCount);
              resolve();
            };
          });
          img.src = '/images/hand/' + i + '.jpg';
          images.push(img);
          promises.push(p);
        }

        Promise.all(promises).then(() => {
          // Preloading complete
          setTimeout(() => {
            if (preloader) {
              preloader.style.opacity = '0';
              setTimeout(() => {
                preloader.style.display = 'none';
                document.body.style.overflow = '';
              }, 500);
            }
            resizeCanvas();
            drawFrame(0);
          }, 300);
        });

        window.addEventListener('resize', resizeCanvas);

        // Scroll listener
        window.addEventListener('scroll', () => {
          if (!scrollContainer) return;
          const rect = scrollContainer.getBoundingClientRect();
          const containerHeight = scrollContainer.offsetHeight - window.innerHeight;
          if (containerHeight <= 0) return;

          // How far scrolled into container
          const scrolled = -rect.top;
          let progress = scrolled / containerHeight;
          progress = Math.max(0, Math.min(1, progress));

          // Background fade near end (from black to #f5f3eb)
          if (progress > 0.85) {
            const bgT = (progress - 0.85) / 0.15;
            stickyFrame.style.backgroundColor = bgT > 0.5 ? '#f5f3eb' : '#000000';
          } else {
            stickyFrame.style.backgroundColor = '#000000';
          }

          // Frame mapping (starts animating after 0.10 progress)
          if (progress >= 0.10) {
            const frameProgress = (progress - 0.10) / 0.90;
            const targetIdx = Math.min(TOTAL_FRAMES - 1, Math.floor(frameProgress * (TOTAL_FRAMES - 1)));
            if (targetIdx !== currentFrame) {
              currentFrame = targetIdx;
              requestAnimationFrame(() => drawFrame(currentFrame));
            }
          } else {
            if (currentFrame !== 0) {
              currentFrame = 0;
              requestAnimationFrame(() => drawFrame(0));
            }
          }

          // "KEEP GOING" text pulses around progress 0.35 to 0.65
          if (progress >= 0.30 && progress <= 0.60) {
            const textAlpha = Math.sin(((progress - 0.30) / 0.30) * Math.PI);
            keepGoingEls.forEach((el, idx) => {
              el.style.opacity = (textAlpha * (1 - idx * 0.18)).toFixed(2);
            });
          } else {
            keepGoingEls.forEach(el => el.style.opacity = '0');
          }
        }, { passive: true });

        // Copy Email Button
        const emailButtons = document.querySelectorAll('button[aria-label="Copy Email"]');
        emailButtons.forEach(btn => {
          btn.addEventListener('click', () => {
            navigator.clipboard.writeText('sahilrpawar3@gmail.com');
            alert('Email copied to clipboard: sahilrpawar3@gmail.com');
          });
        });

        // Ambient Music Toggle
        const audio = new Audio('/music/hrsht.ogg');
        audio.loop = true;
        let isPlaying = false;
        const musicBtn = document.getElementById('music-btn');
        if (musicBtn) {
          musicBtn.addEventListener('click', () => {
            if (isPlaying) {
              audio.pause();
              isPlaying = false;
              musicBtn.classList.remove('text-green-500');
            } else {
              audio.play().then(() => {
                isPlaying = true;
                musicBtn.classList.add('text-green-500');
              }).catch(e => console.log('Audio autoplay prevented:', e));
            }
          });
        }
      })();
    </script>
    <script>
      (function () {
        const container = document.getElementById('scroll-container');
        const capEl = document.getElementById('roll-caption');
        const capText = capEl.querySelector('.rc-text');
        const bar = document.getElementById('roll-progress');
        const fill = bar.querySelector('.rp-fill');
        const label = bar.querySelector('.rp-label');
        const cv = document.getElementById('sparkles');
        const g = cv.getContext('2d');
        const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

        const CAPTIONS = [
          { a: 0.12, b: 0.28, t: 'Every build starts with a pair of hands.' },
          { a: 0.30, b: 0.45, t: '94% accuracy did not happen by accident.' },
          { a: 0.47, b: 0.62, t: 'Debugging at 2am. Shipping at 3.' },
          { a: 0.66, b: 0.80, t: 'Almost there. One more scroll.' }
        ];

        let progress = 0, vel = 0, lastP = 0, lastT = performance.now();
        function readProgress() {
          const rect = container.getBoundingClientRect();
          const h = container.offsetHeight - innerHeight;
          if (h <= 0) return 0;
          return Math.max(0, Math.min(1, -rect.top / h));
        }

        function updateCaption(p) {
          const c = CAPTIONS.find(c => p >= c.a && p <= c.b);
          if (!c) { capEl.style.opacity = 0; return; }
          const span = c.b - c.a, k = (p - c.a) / span;
          const n = Math.ceil(Math.min(1, k / 0.55) * c.t.length);
          capText.textContent = c.t.slice(0, n);
          capEl.style.opacity = k > 0.88 ? Math.max(0, (1 - k) / 0.12) : 1;
        }

        function onScroll() {
          const now = performance.now();
          progress = readProgress();
          const dt = Math.max(16, now - lastT);
          vel = vel * 0.7 + (Math.abs(progress - lastP) / dt * 1000) * 0.3;
          lastP = progress; lastT = now;
          const rect = container.getBoundingClientRect();
          const inside = rect.top <= 0 && rect.bottom > innerHeight * 0.5 && progress < 0.97;
          bar.classList.toggle('show', inside);
          fill.style.width = (progress * 100).toFixed(1) + '%';
          label.textContent = Math.round(progress * 100) + '%';
          updateCaption(progress);
        }
        addEventListener('scroll', onScroll, { passive: true });
        onScroll();

        // pixel sparkles
        const COLORS = ['#4ade80', '#97aa70', '#f5f3eb', '#4ade80'];
        let W = 0, H = 0, parts = [];
        function size() { W = cv.width = cv.clientWidth; H = cv.height = cv.clientHeight; }
        addEventListener('resize', size); size();
        function spawn(initial) {
          const s = 4 + Math.floor(Math.random() * 3);
          return { x: Math.random() * W, y: initial ? Math.random() * H : H + 10, s: s * 1,
            vy: 12 + Math.random() * 28, drift: (Math.random() - 0.5) * 14, ph: Math.random() * 6.28,
            c: COLORS[Math.floor(Math.random() * COLORS.length)], tw: 1 + Math.random() * 3 };
        }
        for (let i = 0; i < 64; i++) parts.push(spawn(true));
        let prev = performance.now();
        function loop(now) {
          const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
          g.clearRect(0, 0, W, H);
          const fade = progress > 0.8 ? Math.max(0, 1 - (progress - 0.8) / 0.07) : 1;
          if (fade > 0) {
            const boost = 1 + Math.min(vel * 9, 5);
            g.globalAlpha = fade;
            for (const p of parts) {
              p.y -= p.vy * boost * dt;
              p.ph += dt * p.tw;
              p.x += (p.drift + Math.sin(p.ph) * 10) * dt;
              if (p.y < -10) Object.assign(p, spawn(false));
              g.globalAlpha = fade * (0.5 + 0.5 * Math.abs(Math.sin(p.ph)));
              g.fillStyle = p.c;
              g.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
            }
            g.globalAlpha = 1;
          }
          requestAnimationFrame(loop);
        }
        if (!reduce) requestAnimationFrame(loop);
      })();
    </script>
