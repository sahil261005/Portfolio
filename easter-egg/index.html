<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Music button toggle
    const audio = new Audio('/music/hrsht.ogg');
    audio.loop = true;
    let isPlaying = false;
    const musicBtn = document.querySelector('button[aria-label="Unmute music"]');
    if (musicBtn) {
      musicBtn.addEventListener('click', () => {
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          musicBtn.setAttribute('aria-label', 'Unmute music');
          musicBtn.classList.remove('text-green-500');
        } else {
          audio.play().then(() => {
            isPlaying = true;
            musicBtn.setAttribute('aria-label', 'Mute music');
            musicBtn.classList.add('text-green-500');
          }).catch(e => console.log('Audio autoplay prevented:', e));
        }
      });
    }
  });
</script>
